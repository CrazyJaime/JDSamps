<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Fallbacks</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f5f8; --fg: #1b1f24; --ok: #1a7f37; --bad: #c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16181c; --fg: #e6e8eb; --ok: #4ac26b; --bad: #ff6b6b; } }
  :root[data-theme="dark"] { --bg: #16181c; --fg: #e6e8eb; --ok: #4ac26b; --bad: #ff6b6b; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #stage { width: 640px; max-width: 100%; height: 300px; background: #000; display: block; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  #go { min-height: 44px; padding: 0 16px; margin: 8px 0; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <button id="go" type="button">Run fallback tests</button>
  <div id="media-host"></div>
  <div id="log"></div>
  <script type="module" src="./engine-fallbacks.js"></script>
</body>
</html>
