  </g>
  <path d="M206 168 L352 256 L206 344 Z" fill="url(#mm-play)" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
  <path d="M222 196 L322 256 L222 316 Z" fill="none" stroke="#2f78d1" stroke-opacity="0.18" stroke-width="6" stroke-linejoin="round"/>
